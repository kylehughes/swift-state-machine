name: Release
'on':
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact 40-character default-branch dispatch commit
        required: true
        type: string
      version:
        description: Semantic version without v
        required: true
        type: string
      notes:
        description: Release notes (required unless generated notes selected)
        type: string
        default: ''
      generated_notes:
        description: Explicitly request generated release notes
        type: boolean
        default: false
      publish:
        description: Explicitly publish verified artifact
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Validate
      shell: bash
      timeout-minutes: 15
      run: |
        python3 -I - <<'PY'
        # This source is embedded inline in the workflow and never executed from an artifact.
        import hashlib
        import json
        import os
        from pathlib import Path
        import re
        import urllib.error
        import urllib.parse
        import urllib.request


        class Unknown(RuntimeError):
            pass


        def validate_inputs(version, candidate, dispatch, notes, generated):
            if not re.fullmatch(r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?", version):
                raise ValueError("Version must be semantic major.minor.patch with optional prerelease")
            if not re.fullmatch(r"[0-9a-f]{40}", candidate) or candidate != dispatch:
                raise ValueError("Candidate must be the exact dispatch commit")
            if not notes.strip() and not generated:
                raise ValueError("Release notes are required unless generated notes are explicitly selected")
            without_build = version.split("+", 1)[0]
            prerelease = without_build.split("-", 1)[1] if "-" in without_build else ""
            if any(part.isdigit() and len(part) > 1 and part.startswith("0") for part in prerelease.split(".")):
                raise ValueError("Numeric prerelease identifiers cannot have leading zeros")
            return "v" + version


        def check_conflicts(api, tag):
            if api("GET", "/git/ref/tags/" + urllib.parse.quote(tag, safe=""), missing=True) is not None:
                raise ValueError("Tag already exists")
            # The list includes drafts when authenticated. Exhaust pagination and never
            # treat a partial release page or an API failure as absence.
            page = 1
            while True:
                releases = api("GET", f"/releases?per_page=100&page={page}")
                if not isinstance(releases, list) or not all(isinstance(item, dict) for item in releases):
                    raise Unknown("Release listing is unobservable")
                if any(item.get("tag_name") == tag for item in releases):
                    raise ValueError("Draft or published release already exists")
                if len(releases) < 100:
                    break
                page += 1
                if page > 100:
                    raise Unknown("Release listing exceeds inspection bound")


        class API:
            def __init__(self, repository, token):
                if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository):
                    raise ValueError("Invalid repository")
                self.base = "https://api.github.com/repos/" + repository
                self.token = token

            def __call__(self, method, path, body=None, *, missing=False, upload=False):
                url = ("https://uploads.github.com" + self.base.removeprefix("https://api.github.com") if upload else self.base) + path
                data = body if isinstance(body, bytes) else json.dumps(body).encode() if body is not None else None
                request = urllib.request.Request(url, data=data, method=method, headers={
                    "Authorization": "Bearer " + self.token, "Accept": "application/vnd.github+json",
                    "X-GitHub-Api-Version": "2022-11-28", "Content-Type": "application/octet-stream" if upload else "application/json"})
                class NoRedirect(urllib.request.HTTPRedirectHandler):
                    def redirect_request(self, *args, **kwargs):
                        raise Unknown("Unexpected API redirect")
                try:
                    with urllib.request.build_opener(NoRedirect()).open(request, timeout=60) as response:
                        return json.load(response)
                except urllib.error.HTTPError as error:
                    if missing and error.code == 404:
                        return None
                    raise Unknown(f"API {method} response {error.code}. Inspect before another write") from error
                except (OSError, ValueError) as error:
                    raise Unknown(f"API {method} outcome unknown. Inspect before another write") from error


        def check_default_branch_head(api, branch, candidate):
            head = api("GET", "/git/ref/heads/" + urllib.parse.quote(branch, safe="/"), missing=True)
            if (not isinstance(head, dict) or head.get("ref") != "refs/heads/" + branch
                    or not isinstance(head.get("object"), dict)
                    or head["object"].get("type") != "commit"
                    or head["object"].get("sha") != candidate):
                raise ValueError("Default branch HEAD no longer matches candidate")


        def inspect_candidate(api, candidate, ref, workflow):
            repo = api("GET", "")
            branch = repo["default_branch"]
            if ref != "refs/heads/" + branch or workflow != candidate:
                raise ValueError("Dispatch workflow and candidate must be the same default-branch commit")
            check_default_branch_head(api, branch, candidate)
            if api("GET", "/commits/" + candidate).get("sha") != candidate:
                raise ValueError("Candidate did not resolve exactly")
            return repo


        def tag_matches(reference, tag, candidate):
            return (isinstance(reference, dict) and reference.get("ref") == "refs/tags/" + tag
                    and isinstance(reference.get("object"), dict)
                    and reference["object"].get("type") == "commit"
                    and reference["object"].get("sha") == candidate)


        def claim_tag(api, tag, candidate):
            path = "/git/ref/tags/" + urllib.parse.quote(tag, safe="")
            intent = {"operation": "create-tag", "ref": "refs/tags/" + tag, "candidate": candidate}
            print(json.dumps(intent), flush=True)
            try:
                created = api("POST", "/git/refs", {"ref": "refs/tags/" + tag, "sha": candidate})
            except Unknown as error:
                # A lost create response or a concurrent existing ref is never an
                # invitation to continue. Inspect once, retain the partial state,
                # and require an explicit later decision rather than retrying.
                try:
                    observed = api("GET", path, missing=True)
                    print(json.dumps({"tag_creation": "uncertain", "inspection": observed}), flush=True)
                except Unknown as inspection_error:
                    print(json.dumps({"tag_creation": "uncertain", "inspection_error": str(inspection_error)}), flush=True)
                raise Unknown("Tag creation response uncertain. Stop and inspect before another write") from error
            print(json.dumps({"tag_creation": "response", "response": created}), flush=True)
            try:
                observed = api("GET", path, missing=True)
            except Unknown as error:
                print(json.dumps({"tag_creation": "unverified", "inspection_error": str(error)}), flush=True)
                raise Unknown("Created tag observation uncertain. Stop and inspect before another write") from error
            print(json.dumps({"tag_creation": "observed", "inspection": observed}), flush=True)
            if not tag_matches(created, tag, candidate) or not tag_matches(observed, tag, candidate):
                raise Unknown("Created tag identity is unverified. Stop and inspect before another write")


        def publish(api, *, tag, candidate, notes, generated, archive, expected_digest):
            payload = archive.read_bytes()
            digest = hashlib.sha256(payload).hexdigest()
            if not re.fullmatch(r"[0-9a-f]{64}", expected_digest) or digest != expected_digest:
                raise ValueError("Artifact bytes differ from read-only build output")
            check_conflicts(api, tag)
            # Retained job logs identify intent before the first write. Never retry a
            # write automatically. Inspect the remote and stop on an unknown outcome.
            print(json.dumps({"tag": tag, "candidate": candidate, "asset": archive.name, "sha256": digest}), flush=True)
            # Atomic create-ref refuses a concurrently created tag. Never move or
            # replace a ref. A later authorized force-move remains outside any
            # cross-API atomicity guarantee. Observe again before publication.
            claim_tag(api, tag, candidate)
            prerelease = "-" in tag.split("+", 1)[0]
            body = {"tag_name": tag, "target_commitish": candidate, "name": tag,
                    "body": notes, "draft": True, "prerelease": prerelease, "generate_release_notes": generated}
            try:
                release = api("POST", "/releases", body)
            except Unknown:
                releases = api("GET", "/releases?per_page=100")
                matches = [r for r in releases if r.get("tag_name") == tag]
                print(json.dumps({"inspection": matches}), flush=True)
                raise Unknown("Release creation response uncertain. Inspect retained state before another write")
            print(json.dumps({"draft_creation": "response", "release": release}), flush=True)
            release_id = release["id"]
            if (release.get("tag_name") != tag or not release.get("draft")
                    or release.get("target_commitish") != candidate or release.get("prerelease") is not prerelease):
                raise Unknown("Created release identity mismatch. Inspect before another write")
            try:
                asset = api("POST", f"/releases/{release_id}/assets?name=" + urllib.parse.quote(archive.name), payload, upload=True)
            except Unknown:
                print(json.dumps({"inspection": api("GET", f"/releases/{release_id}/assets")}), flush=True)
                raise Unknown("Asset upload uncertain. Inspect before another write")
            # GitHub's server digest verifies received bytes without following a
            # redirect carrying write credentials or executing/extracting archive data.
            if asset.get("name") != archive.name or asset.get("size") != len(payload) or asset.get("digest") != "sha256:" + digest:
                raise Unknown("Uploaded asset identity unverified. Inspect before another write")
            boundary_release = api("GET", f"/releases/{release_id}")
            boundary_tag = api("GET", "/git/ref/tags/" + urllib.parse.quote(tag, safe=""), missing=True)
            print(json.dumps({"operation": "publish-draft", "release": boundary_release,
                              "tag": boundary_tag, "candidate": candidate, "sha256": digest}), flush=True)
            if (boundary_release.get("id") != release_id or boundary_release.get("tag_name") != tag
                    or boundary_release.get("draft") is not True
                    or boundary_release.get("target_commitish") != candidate
                    or boundary_release.get("prerelease") is not prerelease
                    or not tag_matches(boundary_tag, tag, candidate)):
                raise Unknown("Publication boundary identity changed. Stop and inspect before another write")
            try:
                result = api("PATCH", f"/releases/{release_id}", {"draft": False, "prerelease": prerelease})
            except Unknown:
                result = api("GET", f"/releases/{release_id}")
                if (result.get("draft") is not False or result.get("tag_name") != tag
                        or result.get("prerelease") is not prerelease):
                    raise Unknown("Publication remains unknown. Stop and inspect")
            remote_tag = api("GET", "/git/ref/tags/" + urllib.parse.quote(tag, safe=""))
            if (result.get("draft") is not False or result.get("tag_name") != tag
                    or result.get("prerelease") is not prerelease
                    or not tag_matches(remote_tag, tag, candidate)):
                raise Unknown("Published release/tag identity is unverified")
            print(json.dumps({"release": result["html_url"], "asset_sha256": digest}), flush=True)


        def main():
            candidate = os.environ["CANDIDATE"]
            notes = os.environ["NOTES"]
            generated = os.environ["GENERATED"] == "true"
            tag = validate_inputs(os.environ["VERSION"], candidate, os.environ["DISPATCH_SHA"], notes, generated)
            if os.environ["GITHUB_REPOSITORY"] != os.environ["EXPECTED_REPOSITORY"]:
                raise ValueError("Release destination differs from the selected repository")
            api = API(os.environ["GITHUB_REPOSITORY"], os.environ["GH_TOKEN"])
            inspect_candidate(api, candidate, os.environ["DISPATCH_REF"], os.environ["WORKFLOW_SHA"])
            if os.environ["OPERATION"] == "validate":
                check_conflicts(api, tag)
            else:
                publish(api, tag=tag, candidate=candidate, notes=notes, generated=generated,
                        archive=Path("release/source.tar.gz"), expected_digest=os.environ["ARCHIVE_SHA256"])


        if __name__ == "__main__":
            main()
        PY
      env:
        CANDIDATE: ${{ inputs.candidate }}
        VERSION: ${{ inputs.version }}
        NOTES: ${{ inputs.notes }}
        GENERATED: ${{ inputs.generated_notes }}
        DISPATCH_SHA: ${{ github.sha }}
        DISPATCH_REF: ${{ github.ref }}
        WORKFLOW_SHA: ${{ github.workflow_sha }}
        GH_TOKEN: ${{ github.token }}
        EXPECTED_REPOSITORY: kylehughes/swift-state-machine
        OPERATION: validate
  build:
    needs:
    - validate
    runs-on: xcode-27
    timeout-minutes: 180
    outputs:
      archive_sha256: ${{ steps.archive.outputs.sha256 }}
    steps:
    - &checkout-candidate
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      timeout-minutes: 5
      with:
        persist-credentials: false
        ref: ${{ inputs.candidate }}
    - &check-credentials
      name: Verify checkout credentials removed
      shell: bash
      timeout-minutes: 2
      run: |
        if git config --local --name-only --get-regexp '(^http\..*extraheader$|^credential\.)'; then
          echo "Unexpected persisted checkout authentication" >&2
          exit 1
        fi
    - &select-swift
      name: Select and observe Swift 6.4
      run: |-
        sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
        printf 'candidate=%s event=%s workflow=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_EVENT_NAME" "$GITHUB_WORKFLOW_SHA" "$GITHUB_RUN_ID"
        xcodebuild -version
        test "$(xcodebuild -version | tail -1)" = "Build version 27A9275"
        swift --version | tee "$RUNNER_TEMP/swift-version.txt"
        grep -E 'Swift version 6\.4([ .]|$)' "$RUNNER_TEMP/swift-version.txt"
      timeout-minutes: 15
      shell: bash
    - name: Build
      run: swift build --build-system native
      timeout-minutes: 15
    - name: Test selected cases
      run: python3 Scripts/check-tests.py
      timeout-minutes: 20
    - name: Release tests
      run: python3 Scripts/check-tests.py --configuration release
      timeout-minutes: 20
    - name: Platform floor builds
      run: python3 Scripts/check-platforms.py
      timeout-minutes: 65
    - name: Device architecture builds
      run: python3 Scripts/check-platforms.py --device
      timeout-minutes: 65
    - name: Distribution interfaces at platform floors
      run: python3 Scripts/check-platforms.py --interfaces
      timeout-minutes: 65
    - name: Compiler fixtures
      run: python3 Scripts/check-compiler-fixtures.py --reuse-macro-plugin
      timeout-minutes: 40
    - name: Debug macro expansions and graph
      run: |
        python3 Scripts/check-macro-expansions.py --configuration debug --output "$RUNNER_TEMP/state-machine-expansions-debug"
        python3 Scripts/check-macro-fixtures.py --configuration debug --output "$RUNNER_TEMP/state-machine-graph-debug"
      timeout-minutes: 15
    - name: Release macro expansions and graph
      run: |
        python3 Scripts/check-macro-expansions.py --configuration release --output "$RUNNER_TEMP/state-machine-expansions-release"
        python3 Scripts/check-macro-fixtures.py --configuration release --output "$RUNNER_TEMP/state-machine-graph-release"
      timeout-minutes: 15
    - name: Strict format
      run: swift format lint --strict --recursive Package.swift Sources Tests
      timeout-minutes: 15
    - name: Static DocC
      run: python3 Scripts/docs.py --output .build/site
      timeout-minutes: 45
    - name: Archive exact candidate
      shell: bash
      timeout-minutes: 15
      run: |
        python3 -I - <<'PY'
        import hashlib, os, pathlib, subprocess
        candidate = os.environ["CANDIDATE"]
        if subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() != candidate:
            raise SystemExit("Checkout candidate mismatch")
        path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "source.tar.gz"
        subprocess.run(["git", "archive", "--format=tar.gz", "--output=" + str(path), candidate], check=True, timeout=120)
        digest = hashlib.sha256(path.read_bytes()).hexdigest()
        with open(os.environ["GITHUB_OUTPUT"], "a") as output:
            output.write("sha256=" + digest + "\n")
        PY
      id: archive
      env:
        CANDIDATE: ${{ inputs.candidate }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      timeout-minutes: 5
      with:
        name: release-${{ inputs.candidate }}
        path: ${{ runner.temp }}/source.tar.gz
        if-no-files-found: error
        retention-days: 7
  explorer:
    needs: validate
    runs-on: xcode-27
    timeout-minutes: 300
    steps:
    - *checkout-candidate
    - *check-credentials
    - *select-swift
    - name: Schedule explorer
      shell: bash
      run: |
        for tier in standard exhaustive; do
          python3 Scripts/check-explorer.py --tier "$tier" \
            --scratch-path "$RUNNER_TEMP/explorer-build" --output "$RUNNER_TEMP/explorer/$tier"
        done
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      if: ${{ !cancelled() }}
      timeout-minutes: 5
      with:
        name: explorer-${{ inputs.candidate }}
        path: ${{ runner.temp }}/explorer
        if-no-files-found: error
        retention-days: 7
  publish:
    needs:
    - validate
    - build
    - explorer
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    concurrency:
      group: release-publish-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      timeout-minutes: 5
      with:
        name: release-${{ inputs.candidate }}
        path: release
    - name: Validate
      shell: bash
      timeout-minutes: 15
      run: |
        python3 -I - <<'PY'
        # This source is embedded inline in the workflow and never executed from an artifact.
        import hashlib
        import json
        import os
        from pathlib import Path
        import re
        import urllib.error
        import urllib.parse
        import urllib.request


        class Unknown(RuntimeError):
            pass


        def validate_inputs(version, candidate, dispatch, notes, generated):
            if not re.fullmatch(r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?", version):
                raise ValueError("Version must be semantic major.minor.patch with optional prerelease")
            if not re.fullmatch(r"[0-9a-f]{40}", candidate) or candidate != dispatch:
                raise ValueError("Candidate must be the exact dispatch commit")
            if not notes.strip() and not generated:
                raise ValueError("Release notes are required unless generated notes are explicitly selected")
            without_build = version.split("+", 1)[0]
            prerelease = without_build.split("-", 1)[1] if "-" in without_build else ""
            if any(part.isdigit() and len(part) > 1 and part.startswith("0") for part in prerelease.split(".")):
                raise ValueError("Numeric prerelease identifiers cannot have leading zeros")
            return "v" + version


        def check_conflicts(api, tag):
            if api("GET", "/git/ref/tags/" + urllib.parse.quote(tag, safe=""), missing=True) is not None:
                raise ValueError("Tag already exists")
            # The list includes drafts when authenticated. Exhaust pagination and never
            # treat a partial release page or an API failure as absence.
            page = 1
            while True:
                releases = api("GET", f"/releases?per_page=100&page={page}")
                if not isinstance(releases, list) or not all(isinstance(item, dict) for item in releases):
                    raise Unknown("Release listing is unobservable")
                if any(item.get("tag_name") == tag for item in releases):
                    raise ValueError("Draft or published release already exists")
                if len(releases) < 100:
                    break
                page += 1
                if page > 100:
                    raise Unknown("Release listing exceeds inspection bound")


        class API:
            def __init__(self, repository, token):
                if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository):
                    raise ValueError("Invalid repository")
                self.base = "https://api.github.com/repos/" + repository
                self.token = token

            def __call__(self, method, path, body=None, *, missing=False, upload=False):
                url = ("https://uploads.github.com" + self.base.removeprefix("https://api.github.com") if upload else self.base) + path
                data = body if isinstance(body, bytes) else json.dumps(body).encode() if body is not None else None
                request = urllib.request.Request(url, data=data, method=method, headers={
                    "Authorization": "Bearer " + self.token, "Accept": "application/vnd.github+json",
                    "X-GitHub-Api-Version": "2022-11-28", "Content-Type": "application/octet-stream" if upload else "application/json"})
                class NoRedirect(urllib.request.HTTPRedirectHandler):
                    def redirect_request(self, *args, **kwargs):
                        raise Unknown("Unexpected API redirect")
                try:
                    with urllib.request.build_opener(NoRedirect()).open(request, timeout=60) as response:
                        return json.load(response)
                except urllib.error.HTTPError as error:
                    if missing and error.code == 404:
                        return None
                    raise Unknown(f"API {method} response {error.code}. Inspect before another write") from error
                except (OSError, ValueError) as error:
                    raise Unknown(f"API {method} outcome unknown. Inspect before another write") from error


        def check_default_branch_head(api, branch, candidate):
            head = api("GET", "/git/ref/heads/" + urllib.parse.quote(branch, safe="/"), missing=True)
            if (not isinstance(head, dict) or head.get("ref") != "refs/heads/" + branch
                    or not isinstance(head.get("object"), dict)
                    or head["object"].get("type") != "commit"
                    or head["object"].get("sha") != candidate):
                raise ValueError("Default branch HEAD no longer matches candidate")


        def inspect_candidate(api, candidate, ref, workflow):
            repo = api("GET", "")
            branch = repo["default_branch"]
            if ref != "refs/heads/" + branch or workflow != candidate:
                raise ValueError("Dispatch workflow and candidate must be the same default-branch commit")
            check_default_branch_head(api, branch, candidate)
            if api("GET", "/commits/" + candidate).get("sha") != candidate:
                raise ValueError("Candidate did not resolve exactly")
            return repo


        def tag_matches(reference, tag, candidate):
            return (isinstance(reference, dict) and reference.get("ref") == "refs/tags/" + tag
                    and isinstance(reference.get("object"), dict)
                    and reference["object"].get("type") == "commit"
                    and reference["object"].get("sha") == candidate)


        def claim_tag(api, tag, candidate):
            path = "/git/ref/tags/" + urllib.parse.quote(tag, safe="")
            intent = {"operation": "create-tag", "ref": "refs/tags/" + tag, "candidate": candidate}
            print(json.dumps(intent), flush=True)
            try:
                created = api("POST", "/git/refs", {"ref": "refs/tags/" + tag, "sha": candidate})
            except Unknown as error:
                # A lost create response or a concurrent existing ref is never an
                # invitation to continue. Inspect once, retain the partial state,
                # and require an explicit later decision rather than retrying.
                try:
                    observed = api("GET", path, missing=True)
                    print(json.dumps({"tag_creation": "uncertain", "inspection": observed}), flush=True)
                except Unknown as inspection_error:
                    print(json.dumps({"tag_creation": "uncertain", "inspection_error": str(inspection_error)}), flush=True)
                raise Unknown("Tag creation response uncertain. Stop and inspect before another write") from error
            print(json.dumps({"tag_creation": "response", "response": created}), flush=True)
            try:
                observed = api("GET", path, missing=True)
            except Unknown as error:
                print(json.dumps({"tag_creation": "unverified", "inspection_error": str(error)}), flush=True)
                raise Unknown("Created tag observation uncertain. Stop and inspect before another write") from error
            print(json.dumps({"tag_creation": "observed", "inspection": observed}), flush=True)
            if not tag_matches(created, tag, candidate) or not tag_matches(observed, tag, candidate):
                raise Unknown("Created tag identity is unverified. Stop and inspect before another write")


        def require_publish_gate(api, *, repo, candidate, run_id, run_attempt, env_name, env_id, publisher_id):
            if run_attempt != "1":
                raise ValueError("Inspect remote state and dispatch a fresh run")
            if not re.fullmatch(r"[1-9][0-9]*", run_id):
                raise ValueError("Invalid workflow run ID")
            repo_id = repo.get("id")
            branch = repo["default_branch"]
            if not isinstance(repo_id, int) or isinstance(repo_id, bool) or repo_id < 1:
                raise Unknown("Repository ID is unobservable")
            run = api("GET", f"/actions/runs/{run_id}/attempts/1")
            if (not isinstance(run, dict) or run.get("id") != int(run_id) or run.get("run_attempt") != 1
                    or run.get("event") != "workflow_dispatch" or run.get("path") != ".github/workflows/release.yml"
                    or run.get("head_branch") != branch or run.get("head_sha") != candidate
                    or not isinstance(run.get("actor"), dict) or run["actor"].get("id") != publisher_id
                    or run["actor"].get("type") != "User"
                    or not isinstance(run.get("repository"), dict) or run["repository"].get("id") != repo_id
                    or not isinstance(run.get("head_repository"), dict) or run["head_repository"].get("id") != repo_id):
                raise ValueError("Workflow run does not match candidate release dispatch")
            environment = api("GET", "/environments/" + urllib.parse.quote(env_name, safe=""))
            if not isinstance(environment, dict) or environment.get("name") != env_name or environment.get("id") != env_id:
                raise ValueError("Release environment identity is unverified")
            ci = api("GET", f"/actions/workflows/ci.yml/runs?event=push&branch={urllib.parse.quote(branch, safe='')}&head_sha={candidate}&status=success&per_page=100")
            if not isinstance(ci, dict) or not isinstance(ci.get("workflow_runs"), list):
                raise Unknown("CI workflow runs are unobservable")
            for ci_run in ci["workflow_runs"]:
                if (isinstance(ci_run, dict) and ci_run.get("path") == ".github/workflows/ci.yml"
                        and ci_run.get("event") == "push" and ci_run.get("head_branch") == branch
                        and ci_run.get("head_sha") == candidate
                        and ci_run.get("status") == "completed" and ci_run.get("conclusion") == "success"
                        and isinstance(ci_run.get("repository"), dict) and ci_run["repository"].get("id") == repo_id
                        and isinstance(ci_run.get("head_repository"), dict) and ci_run["head_repository"].get("id") == repo_id
                        and isinstance(ci_run.get("id"), int) and not isinstance(ci_run.get("id"), bool)
                        and isinstance(ci_run.get("run_attempt"), int) and not isinstance(ci_run.get("run_attempt"), bool)):
                    jobs_resp = api("GET", f"/actions/runs/{ci_run['id']}/attempts/{ci_run['run_attempt']}/jobs?per_page=100")
                    if not isinstance(jobs_resp, dict) or not isinstance(jobs_resp.get("jobs"), list):
                        raise Unknown("CI job listing is unobservable")
                    jobs = jobs_resp["jobs"]
                    if jobs_resp.get("total_count") != len(jobs) or not jobs:
                        raise Unknown("CI job listing is incomplete")
                    if (any(isinstance(j, dict) and j.get("name") == "Required checks"
                            and j.get("status") == "completed" and j.get("conclusion") == "success" for j in jobs)
                            and all(isinstance(j, dict) and j.get("status") == "completed"
                                    and j.get("conclusion") == "success" for j in jobs)):
                        print(json.dumps({"gate_verified": {"run_id": int(run_id), "environment_id": env_id,
                                                            "publisher_id": publisher_id, "ci_run_id": ci_run["id"]}}), flush=True)
                        return
            raise ValueError("Official push CI Required checks did not succeed for this candidate on main")


        def publish(api, *, tag, candidate, branch, notes, generated, archive, expected_digest):
            if archive.is_symlink() or not archive.is_file():
                raise ValueError("Release archive is missing or invalid")
            payload = archive.read_bytes()
            digest = hashlib.sha256(payload).hexdigest()
            if not re.fullmatch(r"[0-9a-f]{64}", expected_digest) or digest != expected_digest:
                raise ValueError("Artifact bytes differ from read-only build output")
            check_conflicts(api, tag)
            check_default_branch_head(api, branch, candidate)
            # Retained job logs identify intent before the first write. Never retry a
            # write automatically. Inspect the remote and stop on an unknown outcome.
            print(json.dumps({"tag": tag, "candidate": candidate, "asset": archive.name, "sha256": digest}), flush=True)
            # Atomic create-ref refuses a concurrently created tag. Never move or
            # replace a ref. A later authorized force-move remains outside any
            # cross-API atomicity guarantee. Observe again before publication.
            claim_tag(api, tag, candidate)
            prerelease = "-" in tag.split("+", 1)[0]
            body = {"tag_name": tag, "target_commitish": candidate, "name": tag,
                    "body": notes, "draft": True, "prerelease": prerelease, "generate_release_notes": generated}
            try:
                release = api("POST", "/releases", body)
            except Unknown:
                releases = api("GET", "/releases?per_page=100")
                matches = [r for r in releases if r.get("tag_name") == tag]
                print(json.dumps({"inspection": matches}), flush=True)
                raise Unknown("Release creation response uncertain. Inspect retained state before another write")
            print(json.dumps({"draft_creation": "response", "release": release}), flush=True)
            release_id = release["id"]
            if (release.get("tag_name") != tag or not release.get("draft")
                    or release.get("target_commitish") != candidate or release.get("prerelease") is not prerelease):
                raise Unknown("Created release identity mismatch. Inspect before another write")
            try:
                asset = api("POST", f"/releases/{release_id}/assets?name=" + urllib.parse.quote(archive.name), payload, upload=True)
            except Unknown:
                print(json.dumps({"inspection": api("GET", f"/releases/{release_id}/assets")}), flush=True)
                raise Unknown("Asset upload uncertain. Inspect before another write")
            # GitHub's server digest verifies received bytes without following a
            # redirect carrying write credentials or executing/extracting archive data.
            if asset.get("name") != archive.name or asset.get("size") != len(payload) or asset.get("digest") != "sha256:" + digest:
                raise Unknown("Uploaded asset identity unverified. Inspect before another write")
            boundary_release = api("GET", f"/releases/{release_id}")
            boundary_tag = api("GET", "/git/ref/tags/" + urllib.parse.quote(tag, safe=""), missing=True)
            print(json.dumps({"operation": "publish-draft", "release": boundary_release,
                              "tag": boundary_tag, "candidate": candidate, "sha256": digest}), flush=True)
            if (boundary_release.get("id") != release_id or boundary_release.get("tag_name") != tag
                    or boundary_release.get("draft") is not True
                    or boundary_release.get("target_commitish") != candidate
                    or boundary_release.get("prerelease") is not prerelease
                    or not tag_matches(boundary_tag, tag, candidate)):
                raise Unknown("Publication boundary identity changed. Stop and inspect before another write")
            try:
                result = api("PATCH", f"/releases/{release_id}", {"draft": False, "prerelease": prerelease})
            except Unknown:
                result = api("GET", f"/releases/{release_id}")
                if (result.get("draft") is not False or result.get("tag_name") != tag
                        or result.get("prerelease") is not prerelease):
                    raise Unknown("Publication remains unknown. Stop and inspect")
            remote_tag = api("GET", "/git/ref/tags/" + urllib.parse.quote(tag, safe=""))
            if (result.get("draft") is not False or result.get("tag_name") != tag
                    or result.get("prerelease") is not prerelease
                    or not tag_matches(remote_tag, tag, candidate)):
                raise Unknown("Published release/tag identity is unverified")
            print(json.dumps({"release": result["html_url"], "asset_sha256": digest}), flush=True)


        def main():
            candidate = os.environ["CANDIDATE"]
            notes = os.environ["NOTES"]
            generated = os.environ["GENERATED"] == "true"
            tag = validate_inputs(os.environ["VERSION"], candidate, os.environ["DISPATCH_SHA"], notes, generated)
            if os.environ["GITHUB_REPOSITORY"] != os.environ["EXPECTED_REPOSITORY"]:
                raise ValueError("Release destination differs from the selected repository")
            api = API(os.environ["GITHUB_REPOSITORY"], os.environ["GH_TOKEN"])
            repo = inspect_candidate(api, candidate, os.environ["DISPATCH_REF"], os.environ["WORKFLOW_SHA"])
            if os.environ["OPERATION"] == "validate":
                check_conflicts(api, tag)
            else:
                require_publish_gate(
                    api,
                    repo=repo,
                    candidate=candidate,
                    run_id=os.environ["RUN_ID"],
                    run_attempt=os.environ["RUN_ATTEMPT"],
                    env_name=os.environ["EXPECTED_ENVIRONMENT"],
                    env_id=int(os.environ["EXPECTED_ENVIRONMENT_ID"]),
                    publisher_id=int(os.environ["EXPECTED_PUBLISHER_ID"]),
                )
                publish(api, tag=tag, candidate=candidate, branch=repo["default_branch"], notes=notes, generated=generated,
                        archive=Path("release/source.tar.gz"), expected_digest=os.environ["ARCHIVE_SHA256"])


        if __name__ == "__main__":
            main()
        PY
      env:
        CANDIDATE: ${{ inputs.candidate }}
        VERSION: ${{ inputs.version }}
        NOTES: ${{ inputs.notes }}
        GENERATED: ${{ inputs.generated_notes }}
        DISPATCH_SHA: ${{ github.sha }}
        DISPATCH_REF: ${{ github.ref }}
        WORKFLOW_SHA: ${{ github.workflow_sha }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        GH_TOKEN: ${{ github.token }}
        EXPECTED_REPOSITORY: kylehughes/swift-state-machine
        EXPECTED_ENVIRONMENT: release
        EXPECTED_ENVIRONMENT_ID: "28291228374"
        EXPECTED_PUBLISHER_ID: "229059"
        OPERATION: publish
        ARCHIVE_SHA256: ${{ needs.build.outputs.archive_sha256 }}
