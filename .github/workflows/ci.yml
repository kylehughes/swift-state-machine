name: CI
'on':
  pull_request: {}
  push: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: xcode-27
    timeout-minutes: 180
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      timeout-minutes: 5
      with:
        persist-credentials: false
    - name: Verify checkout credentials removed
      shell: bash
      timeout-minutes: 2
      run: |
        if git config --local --name-only --get-regexp '(^http\..*extraheader$|^credential\.)'; then
          echo "Unexpected persisted checkout authentication" >&2
          exit 1
        fi
    - name: Select and observe Swift 6.4
      run: |-
        sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
        printf 'candidate=%s event=%s workflow=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_EVENT_NAME" "$GITHUB_WORKFLOW_SHA" "$GITHUB_RUN_ID"
        xcodebuild -version
        test "$(xcodebuild -version | tail -1)" = "Build version 27A9275"
        swift --version | tee "$RUNNER_TEMP/swift-version.txt"
        grep -E 'Swift version 6\.4([ .]|$)' "$RUNNER_TEMP/swift-version.txt"
      timeout-minutes: 15
      shell: bash
    - name: Build
      run: swift build --build-system native
      timeout-minutes: 15
    - name: Test selected cases
      run: python3 Scripts/check-tests.py
      timeout-minutes: 20
    - name: Release tests
      run: python3 Scripts/check-tests.py --configuration release
      timeout-minutes: 20
    - name: Platform floor builds
      run: python3 Scripts/check-platforms.py
      timeout-minutes: 65
    - name: Device architecture builds
      run: python3 Scripts/check-platforms.py --device
      timeout-minutes: 65
    - name: Distribution interfaces at platform floors
      run: python3 Scripts/check-platforms.py --interfaces
      timeout-minutes: 65
    - name: Compiler fixtures
      run: python3 Scripts/check-compiler-fixtures.py
      timeout-minutes: 20
    - name: Debug macro expansions and graph
      run: |
        python3 Scripts/check-macro-expansions.py --configuration debug --output "$RUNNER_TEMP/state-machine-expansions-debug"
        python3 Scripts/check-macro-fixtures.py --configuration debug --output "$RUNNER_TEMP/state-machine-graph-debug"
      timeout-minutes: 15
    - name: Release macro expansions and graph
      run: |
        python3 Scripts/check-macro-expansions.py --configuration release --output "$RUNNER_TEMP/state-machine-expansions-release"
        python3 Scripts/check-macro-fixtures.py --configuration release --output "$RUNNER_TEMP/state-machine-graph-release"
      timeout-minutes: 15
    - name: Strict format
      run: swift format lint --strict --recursive Package.swift Sources Tests
      timeout-minutes: 15
    - name: Static DocC
      run: python3 Scripts/docs.py --output .build/site
      timeout-minutes: 45
  gate:
    name: Required checks
    if: ${{ always() }}
    needs:
    - checks
    runs-on: xcode-27
    timeout-minutes: 5
    steps:
    - name: Validate
      shell: bash
      timeout-minutes: 15
      run: |
        python3 -I - <<'PY'
        import json
        import os

        expected = json.loads(os.environ["EXPECTED_JOBS"])
        observed = json.loads(os.environ["JOB_RESULTS"])
        if not expected or len(expected) != len(set(expected)) or set(observed) != set(expected):
            raise SystemExit("Missing or unexpected required jobs")
        if any(not isinstance(observed[name], dict) or observed[name].get("result") != "success" for name in expected):
            raise SystemExit("Every required job must finish successfully")
        print("All selected checks succeeded")
        PY
      env:
        EXPECTED_JOBS: '["checks"]'
        JOB_RESULTS: ${{ toJSON(needs) }}
